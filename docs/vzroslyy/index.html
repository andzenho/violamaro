<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16121A">
<script>
/* Страховка. Если основной скрипт не разберётся или упадёт на старом браузере,
   человек увидит текст и объяснение, а не белый экран — и мы узнаем об этом.
   Здесь намеренно только ES5: этот блок обязан работать даже там, где не работает остальное.

   Стоит ВЫШЕ подключения Телеграма, и это важно. Пока тег telegram-web-app.js
   был первым и обычным, он держал разбор страницы: провайдер, который на запрос
   не отвечает отказом, а молчит, оставлял человека перед белым экраном сколько
   угодно долго — эта страховка до себя не доходила, и таймер ниже не запускался. */
(function () {
  var shown = false;
  function fallback(msg) {
    if (shown) return;
    shown = true;
    /* Причиной падения могло быть само сохранённое прохождение: формат менялся,
       а запись живёт в памяти браузера до суток. Пока её не убирали, человек
       получал этот экран при каждом открытии — сутки подряд, и «открыть заново»
       ему не помогало. Убираем сразу: перезагрузка после этого лечит. */
    try { localStorage.removeItem("viola-vz-state"); } catch (e) {}
    var box = document.getElementById("screen") || document.body;
    if (!box) return;
    box.innerHTML =
      '<div style="max-width:32rem;margin:1.5rem auto;padding:1.4rem;font:16px/1.55 system-ui,-apple-system,sans-serif;' +
      'color:#241D28;background:#fff;border:1px solid #E0D6DD;border-radius:4px">' +
      '<p style="margin:0 0 .9rem;font-size:1.2rem">Тест не открылся с первого раза</p>' +
      '<p style="margin:0 0 .9rem;color:#5C5162">Так бывает: оборвалась связь или страница не догрузилась. ' +
      'Нажмите «Открыть заново» — обычно этого хватает.</p>' +
      '<p style="margin:0 0 .9rem"><button onclick="location.reload()" ' +
      'style="font:inherit;padding:.7rem 1.1rem;color:#fff;background:#A2703C;border:0;border-radius:4px">' +
      'Открыть заново</button></p>' +
      '<p style="margin:0 0 .9rem;color:#5C5162">Не помогло — откройте ту же ссылку в обычном браузере: ' +
      '<a href="https://andzenho.github.io/violamaro/vzroslyy/" style="color:#A2703C">andzenho.github.io/violamaro/vzroslyy</a></p>' +
      '<p style="margin:0;font-size:.8rem;color:#8B7F92">Если и там не открылось, пришлите нам эту строку: ' +
      String(msg).replace(/</g, "&lt;").slice(0, 200) + '</p></div>';
  }
  window.__fallback = fallback;
  window.addEventListener("error", function (e) {
    fallback(e && e.message ? e.message : "неизвестная ошибка");
  });
  /* Скрипт у нас встроенный, ему нечего ждать. Пусто через семь секунд — значит не доехал. */
  setTimeout(function () {
    var s = document.getElementById("screen");
    if (s && !s.firstChild) fallback("пустой экран");
  }, 7000);

  /* ——— когда стартовать ———
     Телеграм грузится фоном и держать страницу больше не может. Тест ждёт его
     не дольше TG_WAIT: доехал раньше — стартуем сразу, не доехал — стартуем без
     него. Обращения к Телеграму в основном скрипте и так идут через
     window.Telegram && window.Telegram.WebApp, поэтому без SDK тест просто
     работает как в обычном браузере: не будет разворота во весь экран
     и телеграм-id в таблице. Это несравнимо лучше белого экрана. */
  var TG_WAIT = 3000;
  var tgSettled = false, appStart = null, launched = false;

  function launch() {
    if (launched || !tgSettled || !appStart) return;
    launched = true;
    appStart();
  }

  /* Телеграм опоздал к запуску — подхватываем его на ходу: развернуть окно
     и выключить свайпы можно и после того, как человек увидел первый экран. */
  function lateInit() {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;
    try {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    } catch (e) {}
  }

  window.__tgSettled = function () {
    if (tgSettled) return;
    tgSettled = true;
    if (launched) lateInit(); else launch();
  };
  window.__appStart = function (fn) { appStart = fn; launch(); };
  setTimeout(window.__tgSettled, TG_WAIT);
})();
</script>

        onerror="window.__tgSettled && window.__tgSettled()"></script>

/* ——— подсчёт ———
   Все утверждения написаны в одну сторону, поэтому балл по шкале — это сила
   детской стороны, а не слабость. Тип называет та шкала, что набрала больше всех:
   именно она сейчас управляет жизнью.
   Считаем по разметке вопросов, а не по их номерам. */
function score() {
  const sc = { R: 0, G: 0, O: 0, K: 0 };
  const sph = {};
  SPHERES.forEach(x => sph[x.k] = { got: 0, max: 0 });

  Q.forEach((q, i) => {
    const v = typeof answers[i] === "number" ? answers[i] : 0;
    if (q.ctrl) { sc.K += v; return; }
    sc[q.s] += v;
    const cell = sph[q.sf];
    cell.got += v;
    cell.max += 3;
  });

  /* Доля взрослой стороны: по каждой сфере и в целом. Отдельного «процента
     детскости» не показываем нигде — это был бы приговор, а не карта. */
  const map = SPHERES.map(x => {
    const c = sph[x.k];
    return { k: x.k, t: x.t, pct: c.max ? Math.round((1 - c.got / c.max) * 100) : 0 };
  });

  const total = sc.R + sc.G + sc.O;          // максимум 63
  const pct = Math.max(15, Math.min(95, Math.round((1 - total / 63) * 100)));

  /* Другой профиль — не по абсолютному баллу контроля, а по перевесу над
     остальными шкалами. Иначе человек, который отвечает «да» на всё, набирает
     максимум и по контролю, и по шкалам — и вылетает в отказ, хотя он ровно
     наша аудитория. Проверено: при всех «да» разница нулевая, отказ не срабатывает. */
  const kMean = sc.K / 3;                    // средний ответ по контролю, 0..3
  const sMean = (sc.R + sc.G + sc.O) / 21;   // средний ответ по трём шкалам, 0..3

  /* Порядок проверок: сначала другой профиль, потом взрослая позиция,
     и только потом тип по сильнейшей шкале.
     Обе величины намеренно приведены к одной шкале 0..3. Пока контроль считался
     долей от максимума, а порог стоял в баллах, ветка «другая история» не могла
     сработать вообще ни разу — ровно та поломка, что год держала «Проснувшегося
     эмпата» мёртвым в прошлом тесте. Ловится только прогоном, не чтением. */
  let key;
  if (kMean >= 2 && kMean - sMean >= 0.75) key = "other";
  else if (sc.R <= ADULT && sc.G <= ADULT && sc.O <= ADULT) key = "adult";
  else if (sc.R >= sc.G && sc.R >= sc.O) key = "waiting";
  else if (sc.G >= sc.O) key = "merged";
  else key = "holding";

  return { key: key, pct: pct, map: map, scales: { R: sc.R, G: sc.G, O: sc.O, K: sc.K } };
}

/* Имя из Телеграма подставляется в разметку. Кавычка в имени рвала атрибут

const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]);
}

   только на экране анкеты — а первая такая ссылка попадается человеку раньше,
   на первом экране, под кнопкой «Начать».
   Ссылки на t.me не трогаем: их уводит openTelegramLink, и у них свои
   обработчики — перехватить здесь значило бы открыть канал дважды. */
function linksThroughTelegram_(node) {
  node.querySelectorAll("a").forEach(a => a.addEventListener("click", (e) => {
    const href = a.getAttribute("href");
    if (!href || href.indexOf("http") !== 0) return;
    if (href.indexOf("https://t.me/") === 0) return;
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.openLink) { e.preventDefault(); tg.openLink(href); }
  }));
}

/* Каждый новый экран показываем с начала — иначе человек попадает
   на середину длинного текста и не понимает, что сменилось. */
function toTop() {
  try {
    window.scrollTo(0, 0);
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  } catch (e) {}
}

function intro() {
  stage = "intro";
  const n = el(`
    <div class="card">
      <h1>Кто принимает решения о вашей жизни?</h1>
      <div class="body-copy intro-voice">
        <p>Тут двадцать четыре утверждения. Про деньги, близких, работу и про вас самих.</p>
        <p>Отвечайте сразу, первым, что придёт в голову. Начнёте примерять каждое слово — получится про кого-то другого.</p>
        <p>И вот в конце вы увидите карту: в какой сфере решаете вы, а в какой за вас решают до сих пор.</p>
        <p>Правильных ответов тут нет, оценивать вас никто не будет. Три минуты. Поехали.</p>
      </div>
      <p class="quiet">Это не диагностика и не диагноз. Это способ посмотреть на себя со стороны.</p>
      <button class="go" id="start">Начать</button>
      <p class="quiet">Нажимая «Начать», вы соглашаетесь с <a href="${CONFIG.docs.privacy}" target="_blank" rel="noopener">Политикой обработки персональных данных</a>.</p>
    </div>`);
  n.querySelector("#start").addEventListener("click", () => { idx = 0; startedAt = Date.now(); stage = "q"; saveState(); question(); });
  linksThroughTelegram_(n);
  render(n);
}

function question() {
  stage = "q";
  const q = Q[idx];
  const n = el(`
    <div class="card">
      ${q.note ? `<p class="voice">${q.note}</p>` : ""}
      <div class="step">Утверждение ${idx + 1}</div>
      <h2>${q.t}</h2>
      <div class="answers">
        ${SCALE.map((s, i) => `<button class="ans" data-v="${3 - i}">${s}</button>`).join("")}
      </div>
      ${idx > 0 ? `<button class="ghost" id="back">← Назад</button>` : ""}
    </div>`);

  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    answers[idx] = Number(b.dataset.v);
    idx++;
    if (idx < Q.length) { saveState(); question(); } else { idx = 0; saveState(); fork(); }
  }));
  const back = n.querySelector("#back");
  if (back) back.addEventListener("click", () => { idx--; answers.length = idx; saveState(); question(); });
  render(n);
}

function fork() {
  stage = "fork";
  const f = FORKS[idx];
  const n = el(`
    <div class="card">
      <div class="step">Ещё ${FORKS.length - idx} ${FORKS.length - idx === 1 ? "вопрос" : "вопроса"}</div>
      <h2>${f.q}</h2>
      <div class="answers">
        ${f.a.map((o, i) => `<button class="ans" data-i="${i}">${o[0]}</button>`).join("")}
      </div>
    </div>`);
  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    const pick = f.a[Number(b.dataset.i)]; forks[f.k] = pick[1]; forks[f.k + "_text"] = pick[0];
    idx++;
    saveState();
    if (idx < FORKS.length) fork(); else result();
  }));
  render(n);
}

function result(prev) {
  stage = "result";
  const r = prev || score();
  lastResult = r;
  const t = RESULTS[r.key];

  const n = el(`
    <div class="card">
      <div class="verdict">
        <div class="cap">${t.cap}</div>
        <h1>${t.name}</h1>
      </div>
      <div class="body-copy">${t.body.map(p => `<p>${p}</p>`).join("")}</div>
      ${r.key === "other" ? "" : `
        <div class="map">
          <div class="map-h">Где решаете вы, а где за вас</div>
          ${r.map.map(x => `
            <div class="map-row">
              <div class="map-name">${x.t}</div>
              <div class="map-bar"><span style="width:${Math.max(3, x.pct)}%"></span></div>
              <div class="map-val">${x.pct}%</div>
            </div>`).join("")}
          <p class="map-note">Чем длиннее полоса, тем больше в этой сфере решаете вы.</p>
        </div>`}
      ${t.bridge ? `<p class="bridge">${t.bridge}<span class="anchor">${ANCHOR}</span><span class="anchor-2">${ANCHOR_2}</span></p>` : ""}
      <div class="foot">
        ${t.bridge ? `<button class="go big" id="offer">Что за событие? <span aria-hidden="true">→</span></button>` : ""}
        ${!t.bridge && CONFIG.publicChannel ? `<a class="go big" id="channel" href="${CONFIG.publicChannel}" target="_blank" rel="noopener">Читать Виолу в Телеграме <span aria-hidden="true">→</span></a>
        <p class="cta-note">Каждый день — про людей, границы и чувствительность.</p>` : ""}
        <button class="ghost" id="again">Пройти заново</button>
      </div>
      <p class="disclaim">Это не диагностика и не диагноз. Это способ посмотреть на себя со стороны.</p>
    </div>`);

  const toOffer = n.querySelector("#offer");
  if (toOffer) toOffer.addEventListener("click", () => offer(r));
  const toChannel = n.querySelector("#channel");
  if (toChannel) toChannel.addEventListener("click", (e) => {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(CONFIG.publicChannel); }
  });

  n.querySelector("#again").addEventListener("click", () => {
    answers.length = 0; clearState(); flush(); intro();
  });

  if (!prev) send(r);
  saveState();          // чтобы перезагрузка вернула человека на результат, а не в начало
  render(n);
}

/* ——— экран программы и переход в анкету ——— */
function open_(url) {
  if (!url) return;
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank", "noopener");
}

function offer(r) {
  const n = el(`
    <div class="card">
      <div class="title-block">
        <div class="step"><span class="tag">${OFFER.tag}</span></div>
        <div class="step">${OFFER.eyebrow}</div>
        <h2 class="offer-title">${OFFER.title}</h2>
      </div>
      <p class="lede">${OFFER.lead}</p>
      <div class="body-copy">${OFFER.body.map(p => `<p>${p}</p>`).join("")}</div>
      <div class="inside">
        <div class="inside-h">${OFFER.insideHead}</div>
        <ul>${OFFER.inside.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>
      <div class="gets">
        <div class="gets-h">${OFFER.getsHead}</div>
        <ul>${OFFER.gets.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>
      <div class="gets bonus">
        <div class="gets-h">${OFFER.bonusHead}</div>
        <ul>${OFFER.bonus.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>
      <p class="med">${OFFER.med}</p>
      <div class="foot">
        <div class="before-cta">${OFFER.beforeCta.map(t => `<p>${t}</p>`).join("")}</div>
        <!-- Стрелка привязана неразрывным пробелом: на узком экране она уезжала одна на строку. -->
        <button class="go big" id="pay">${OFFER.cta} за ${CONFIG.price}&nbsp;<span aria-hidden="true">→</span></button>
        <p class="cta-note">${OFFER.ctaNote}${CONFIG.priceUntil ? " Цена держится до " + CONFIG.priceUntil + "." : ""}</p>
        <p class="cta-legal">Нажимая кнопку, вы соглашаетесь с <a href="${CONFIG.docs.privacy}" target="_blank" rel="noopener">Политикой обработки персональных данных</a>.</p>
        <button class="ghost" id="back-res">← Вернуться к результату</button>
      </div>
    </div>`);

  n.querySelector("#pay").addEventListener("click", () => { sendGo(r); openPay(); });
  n.querySelector("#back-res").addEventListener("click", () => result(r));
  linksThroughTelegram_(n);
  render(n);
}

/* Уводим на оплату. Пока страницы оплаты нет — в чат с командой, чтобы кнопка
   не вела в никуда. Обе ссылки телеграмовские или обычные, различаем по адресу. */
function openPay() {
  const url = CONFIG.payUrl || CONFIG.teamChat;
  if (!url) return;
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    if (url.indexOf("t.me/") !== -1 && tg.openTelegramLink) {
      try { tg.openTelegramLink(url); return; } catch (e) {}
    }
    if (tg.openLink) { try { tg.openLink(url); return; } catch (e) {} }
  }
  window.open(url, "_blank", "noopener");
}

/* Отметка «пошёл платить». Формы здесь нет, контакт оставляет сама оплата, —
   но без этой записи мы не знаем, кто дошёл до кнопки и не дошёл до оплаты. */
function sendGo(r) {
  const tg = window.Telegram && window.Telegram.WebApp;
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  queue({
    test: "vzroslyy",
    type: "lead",
    rank: r.key,
    percent: r.pct,
    forks: forks,
    userId: u.id || "",
    name: [u.first_name, u.last_name].filter(Boolean).join(" "),
    contact: u.username ? "@" + u.username : ""
  });
}

const BUFFER_KEY = "viola-vz-pending";

/* Данные уходят обычным GET с параметром: POST на веб-приложение Apps Script
   у анонимных запросов упирается в редирект и не доходит. Проверено. */
function send_(payload) {
  return fetch(CONFIG.sheetUrl + "?payload=" + encodeURIComponent(JSON.stringify(payload)));
}

/* Кладём в буфер и пробуем отправить. Не дошло — полежит и уйдёт
   при следующем открытии страницы. Иначе обрыв связи = потерянный лид. */
function queue(item) {
  buffer(item);
  flush();
}

function buffer(item) {
  try {
    const all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]");
    all.push(item);
    localStorage.setItem(BUFFER_KEY, JSON.stringify(all));
  } catch (e) {}
}

/* Вынимаем из буфера ровно одну запись — ту, что подтвердил приёмник. */
function unbuffer(item) {
  try {
    const s = JSON.stringify(item);
    const all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]");
    const i = all.findIndex(x => JSON.stringify(x) === s);
    if (i !== -1) {
      all.splice(i, 1);
      localStorage.setItem(BUFFER_KEY, JSON.stringify(all));
    }
  } catch (e) {}
}

const inFlight = new Set();

/* Буфер чистим ТОЛЬКО после подтверждения от приёмника.
   Раньше буфер очищался до отправки — и если Телеграм выгружал вкладку,
   пока запрос в пути (а он уходит ровно тогда, когда человека уводит в канал),
   лид пропадал молча. Дубль в таблице пережить можно, потерю контакта — нет. */
function flush() {
  if (!CONFIG.sheetUrl) return;
  let all = [];
  try { all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]"); } catch (e) { return; }
  if (!all.length) return;
  /* Обёртка не про сеть, а про сам вызов: fetch есть не в каждом вебвью,
     и на телефоне без него исключение уходило вверх — в boot(). Человек
     вместо теста получал экран отказа из-за одной недоставленной заявки. */
  try {
    all.forEach(item => {
      const key = JSON.stringify(item);
      if (inFlight.has(key)) return;     // тот же элемент уже летит — второй раз не шлём
      inFlight.add(key);
      send_(item)
        .then(res => res.text())
        .then(txt => {
          /* Приёмник отвечает {"ok":true}. Если вместо этого прилетела страница
             входа Google — значит развёртывание закрыто, и запись НЕ сохранилась.
             Оставляем её в буфере до следующего раза. */
          if (txt.indexOf('"ok"') !== -1) unbuffer(item);
        })
        .catch(() => {})
        .then(() => { inFlight.delete(key); });
    });
  } catch (e) {}
}

/* ——— отправка результата ———
   Адресат один: таблица. Она получает всё сырьё для калибровки.

   Бота отсюда НЕ трогаем. Telegram.WebApp.sendData по документации
   «отправляет служебное сообщение боту, и мини-апп закрывается» — то есть
   человек, открывший тест кнопкой клавиатуры, вылетал в чат ровно на переходе
   к результату и своего типа не видел. Ранг и процент берём из таблицы. */
function send(r) {
  const tg = window.Telegram && window.Telegram.WebApp;
  const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};

  const seconds = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;
  const same = answers.length && answers.every(x => x === answers[0]);

  const payload = {
    test: "vzroslyy",                    // приёмник по этой метке выбирает лист
    seconds: seconds,
    fast: seconds > 0 && seconds < 25,   // 24 вопроса быстрее 25 секунд — читать человек не успевал
    monotone: same,                      // одна и та же кнопка на всё
    rank: r.key,
    percent: r.pct,
    scales: r.scales,
    map: r.map,
    forks: forks,
    answers: answers.slice(),
    userId: user.id || "",
    userName: [user.first_name, user.last_name].filter(Boolean).join(" ")
  };
  window.__result = payload;

  /* Через буфер, как и лид: обрыв связи на этом шаге раньше терял прохождение молча. */
  if (CONFIG.sheetUrl) queue(payload);
}

/* ——— сохранение прогресса ———
   Мини-апп внутри Телеграма может перезагрузиться сам: свернули и вернулись,
   система выгрузила вкладку из памяти, сработал жест закрытия. Страница при этом
   стартует заново, и без сохранения человек оказывается в начале теста.
   Держим ответы в памяти браузера и возвращаем его на то же место. */
const STATE_KEY = "viola-vz-state";
const TTL_MID = 3 * 3600e3;    // недопройденный тест живёт три часа
const TTL_DONE = 24 * 3600e3;  // готовый результат — сутки

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      t: Date.now(), stage: stage, idx: idx,
      answers: answers.slice(), forks: forks, startedAt: startedAt,
      res: lastResult
    }));
  } catch (e) {}
}

function clearState() {
  try { localStorage.removeItem(STATE_KEY); } catch (e) {}
}

/* Шкалы, без которых экран результата не построить: powers() читает их
   напрямую. Раньше запись без них роняла запуск. */
const SCALES_NEEDED = ["R", "G", "O", "K"];

/* Сохранённое прохождение могло остаться от прежней версии теста: вопросы
   и способ хранения результата менялись, а запись живёт до суток. Такое
   состояние роняло boot(), и человек при каждом открытии видел экран
   «тест не открылся» — весь срок хранения. Не сошлось — молча начинаем
   заново: потерять полтора экрана ответов не так дорого, как сутки не мочь
   войти. Проходящему сейчас это ничем не грозит — его запись форме отвечает. */
function stateOk_(s) {
  const a = s.answers;
  if (!Array.isArray(a) || a.length > Q.length) return false;
  if (!a.every(v => typeof v === "number" && v >= 0 && v <= 3)) return false;
  if (s.res) {
    if (!RESULTS[s.res.key]) return false;
    const sc = s.res.scales;
    if (!sc || typeof sc !== "object") return false;
    if (!SCALES_NEEDED.every(k => typeof sc[k] === "number")) return false;
  }
  return true;
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if (!s || !s.t) return null;
    const done = (s.answers || []).length === Q.length;
    if (Date.now() - s.t > (done ? TTL_DONE : TTL_MID)) { clearState(); return null; }
    if (!stateOk_(s)) { clearState(); return null; }
    return s;
  } catch (e) { return null; }
}

function boot() {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    /* Экран результата длинный. Пока листаешь его вниз, Телеграм может принять
       прокрутку за жест «свернуть» и утащить приложение. Bot API 7.7+ */
    if (tg.disableVerticalSwipes) { try { tg.disableVerticalSwipes(); } catch (e) {} }
  }

  flush();   // всё, что не ушло в прошлый раз, отправляем при каждом открытии

  const s = loadState();
  if (!s) { intro(); return; }

  (s.answers || []).forEach(v => answers.push(v));
  Object.keys(s.forks || {}).forEach(k => { forks[k] = s.forks[k]; });
  startedAt = s.startedAt || 0;

  if (answers.length === Q.length) {
    if (s.stage === "fork" && (s.idx || 0) < FORKS.length) { idx = s.idx || 0; fork(); return; }
    /* Аргумент обязателен: без него result() отправит прохождение в таблицу второй раз.
       Берём сохранённый вердикт, если он есть, — тогда тип не переиграется. */
    result(s.res || score());
    return;
  }
  if (s.stage === "q" && answers.length) { idx = Math.min(s.idx || 0, Q.length - 1); question(); return; }

  answers.length = 0;
  intro();
}

/* Стартуем не сразу: страховка наверху дождётся Телеграма — или того, что его
   не будет, — и позовёт сама. Прямой вызов оставлен на случай, если верхний
   блок почему-то не отработал: без запуска тест не оставляем ни при каких условиях. */
function run() {
  try {
    boot();
  } catch (e) {
    if (window.__fallback) window.__fallback(e && e.message ? e.message : e);
  }
}

if (window.__appStart) window.__appStart(run); else run();
</script>
