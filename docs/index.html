  lead: "Осенью у Виолы выходит программа с таким названием. Название не про две темы — про одно состояние.",
  body: [
    "Любовь и деньги приходят из одного места: когда внутри полно. Из пустоты не появляется ни первое, ни второе — сколько ни старайся.",
    "Изобилие — это не роскошь. Это свобода жить свою жизнь: делать что хотите, когда хотите, с кем хотите."
  ],
  insideHead: "Что разбираем",
  inside: [
    "Где именно утекают силы — и как перекрыть, не став холодным человеком.",
    "Как отличать своё состояние от чужого. Это навык, ему учатся.",
    "Почему брать деньги за свою работу неловко — и что с этим делать.",
    "Чего хотите вы. Не близкие, не дети, не начальник."
  ],
  format: "Практики и рабочая тетрадь, разборы, ответы Виолы. Не лекции.",
  perks: [
    { h: "Самая низкая цена", d: "Первый поток заходит по самой низкой цене. Назовём её в канале." },
    { h: "Закрытый канал Виолы", d: "Материалы и подкасты, которых нет нигде больше. Доступ — сразу после записи." },
    { h: "Право сказать, что включить", d: "В канале спросим, чего вам не хватает, и соберём часть программы из ваших ответов. Вы всю жизнь угадываете, что нужно другим. Здесь спрашивают вас.", wide: true }
  ],
  cta: "Хочу в первый поток",
  note: "Два поля: имя и телеграм. Двадцать секунд — остальное мы уже знаем из вашего теста."
};

const ANCHOR = "Осенью Виола собирает под это программу.";

const FON_NOTE = "Отдельно: часть того, что вас грузит, идёт не от людей, а от общего фона — шум, свет, слишком много всего. Это не про эмпатию, и в тесте оно не решается.";

/* ——— состояние ——— */
let stage = "intro";      // intro | q | fork | result
let idx = 0;
const answers = [];        // баллы 3..0 по каждому вопросу
const forks = {};

const screen = document.getElementById("screen");
const dial = document.getElementById("dial");
const counter = document.getElementById("counter");

Q.forEach(() => {
  const t = document.createElement("div");
  t.className = "tick";
  dial.appendChild(t);
});

function paintDial() {
  const ticks = dial.children;
  for (let i = 0; i < ticks.length; i++) {
    ticks[i].className = "tick" +
      (stage === "q" && i === idx ? " now" : (i < answers.length ? " done" : ""));
  }
  counter.textContent = stage === "q" ? (idx + 1) + " / " + Q.length
    : stage === "fork" ? "почти всё"
    : stage === "result" ? "результат" : "";
}

/* ——— подсчёт ——— */
function inv(v) { return 3 - v; }

function score() {
  const v = answers;
  const A = v[0] + v[1] + v[2];
  const P = inv(v[3]) + inv(v[5]) + inv(v[6]);
  const I = v[7] + v[8] + v[9];
  const B = v[10] + v[11] + v[12];
  const C = v[13] + v[14] + v[15] + v[16];
  const G = inv(v[18]) + v[19];
  const L = v[20] + v[21];
  const F = v[22] + v[23];
  const K = (v[4] === 3 ? 1 : 0) + (v[17] === 3 ? 1 : 0);

  const dar = A / 9;
  const prox = Math.max(P, I) / 9;
  const price = Math.max(B / 9, C / 12, I / 9);
  let pct = Math.round(dar * 40 + prox * 30 + price * 30);
  if (K === 2) pct -= 10;
  pct = Math.max(20, Math.min(97, pct));

  /* Порядок важен: «считывающий» проверяется последним из отказов — иначе он
     забирает и тех, у кого просто тихий приёмник, и тех, кого грузит фон. */
  let key;
  if (F >= 5 && L <= 1 && A <= 5) key = "other";
  else if (A <= 3 && C <= 4) key = "caring";
  else if (A >= 6 && P <= 3 && I <= 4 && B <= 3) key = "reader";
  else if (I >= 6 && B / 9 < .5 && C / 12 < .5 && G <= 2 && K < 2) key = "awake";
  else {
    const b = B / 9, c = C / 12, g = G / 6;
    key = (c >= b && c >= g) ? "donor" : (b >= g ? "filter" : "sleeping");
  }

  const empath = ["donor", "filter", "sleeping", "awake"].includes(key);
  return { key, pct, fon: empath && F >= 4, scales: { A, P, I, B, C, G, L, F, K } };
}

/* ——— экраны ——— */
function el(html) {
  const d = document.createElement("div");
  d.className = "fade";
  d.innerHTML = html;
  return d;
}

function render(node) {
  screen.replaceChildren(node);
  paintDial();
}

function intro() {
  stage = "intro";
  const n = el(`
    <div class="card">
      <h1>Есть у вас способности эмпата?</h1>
      <p class="lede">24 коротких утверждения. Три минуты. В конце вы увидите, насколько совпадаете с портретом эмпата и как именно это у вас устроено.</p>
      <p class="quiet">Отвечайте первым, что приходит в голову. Так точнее.<br>Это не диагностика и не диагноз. Это зеркало.</p>
      <button class="go" id="start">Начать</button>
    </div>`);
  n.querySelector("#start").addEventListener("click", () => { idx = 0; question(); });
  render(n);
}

function question() {
  stage = "q";
  const q = Q[idx];
  const n = el(`
    <div class="card">
      ${q.note ? `<p class="voice">${q.note}</p>` : ""}
      <div class="step">Утверждение ${idx + 1}</div>
      <h2>${q.t}</h2>
      <div class="answers">
        ${SCALE.map((s, i) => `<button class="ans" data-v="${3 - i}">${s}</button>`).join("")}
      </div>
      ${idx > 0 ? `<button class="ghost" id="back">← Назад</button>` : ""}
    </div>`);

  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    answers[idx] = Number(b.dataset.v);
    idx++;
    if (idx < Q.length) question(); else { idx = 0; fork(); }
  }));
  const back = n.querySelector("#back");
  if (back) back.addEventListener("click", () => { idx--; answers.length = idx; question(); });
  render(n);
}

function fork() {
  stage = "fork";
  const f = FORKS[idx];
  const n = el(`
    <div class="card">
      <div class="step">Ещё ${FORKS.length - idx} ${FORKS.length - idx === 1 ? "вопрос" : "вопроса"}</div>
      <h2>${f.q}</h2>
      <div class="answers">
        ${f.a.map((o, i) => `<button class="ans" data-i="${i}">${o[0]}</button>`).join("")}
      </div>
    </div>`);
  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    const pick = f.a[Number(b.dataset.i)]; forks[f.k] = pick[1]; forks[f.k + "_text"] = pick[0];
    idx++;
    if (idx < FORKS.length) fork(); else result();
  }));
  render(n);
}

function result(prev) {
  stage = "result";
  const r = prev || score();
  const t = RESULTS[r.key];

  const n = el(`
    <div class="card">
      <div class="verdict">
        <div class="cap">${t.cap}</div>
        <h1>${t.name}</h1>
      </div>
      <div class="body-copy">${t.body.map(p => `<p>${p}</p>`).join("")}</div>
      ${t.voice ? `<p class="voice">${t.voice}</p>` : ""}
      ${r.fon ? `<p class="addendum">${FON_NOTE}</p>` : ""}
      ${t.bridge ? `<p class="bridge">${t.bridge}${forks.zapros && ZAPROS_LINE[forks.zapros] ? " " + ZAPROS_LINE[forks.zapros] : ""}<span class="anchor">${ANCHOR}</span></p>` : ""}
      <div class="foot">
        ${t.bridge && CONFIG.formUrl ? `<button class="go" id="offer">Что за программа?</button>` : ""}
        ${!t.bridge && CONFIG.channelUrl ? `<button class="go" id="channel">Забрать материалы Виолы</button>` : ""}
        <button class="ghost" id="share">Поделиться результатом</button>
        <button class="ghost" id="again">Пройти заново</button>
      </div>
      <p class="disclaim">Это не диагностика и не диагноз. Это зеркало: сверить, как у вас устроено.</p>
    </div>`);

  const toOffer = n.querySelector("#offer");
  if (toOffer) toOffer.addEventListener("click", () => offer(r));
  const toChannel = n.querySelector("#channel");
  if (toChannel) toChannel.addEventListener("click", () => open_(CONFIG.channelUrl));

  const share = n.querySelector("#share");
  share.addEventListener("click", () => {
    const line = `Мой тип по тесту Виолы Маро — ${t.name.toLowerCase()}. А у тебя?`;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(line).then(() => { share.textContent = "Скопировано"; },
        () => { share.textContent = line; });
    } else { share.textContent = line; }
  });
  n.querySelector("#again").addEventListener("click", () => { answers.length = 0; intro(); });

  if (!prev) send(r);
  render(n);
}

/* ——— экран программы и переход в анкету ——— */
function open_(url) {
  if (!url) return;
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank", "noopener");
}

function formLink(r) {
  const tg = window.Telegram && window.Telegram.WebApp;
  const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  const code = (user.id || "web") + "-" + r.key + "-" + r.pct;
  if (!CONFIG.formCode) return CONFIG.formUrl;
  return CONFIG.formUrl + "?usp=pp_url&" + CONFIG.formCode + "=" + encodeURIComponent(code);
}

function offer(r) {
  const n = el(`
    <div class="card">
      <div class="step">Что дальше</div>
      <h2>${OFFER.title}</h2>
      <p class="lede">${OFFER.lead}</p>
      <div class="body-copy">${OFFER.body.map(p => `<p>${p}</p>`).join("")}</div>
      <div class="inside">
        <div class="inside-h">${OFFER.insideHead}</div>
        <ul>${OFFER.inside.map(i => `<li>${i}</li>`).join("")}</ul>
        <p class="format">${OFFER.format}</p>
      </div>
      <div class="perks">
        ${OFFER.perks.map(p => `<div class="perk${p.wide ? " wide" : ""}"><div class="perk-h">${p.h}</div><p>${p.d}</p></div>`).join("")}
      </div>
      <div class="foot">
        <button class="go big" id="form">${OFFER.cta} <span aria-hidden="true">→</span></button>
        <p class="cta-note">${OFFER.note}</p>
        <button class="ghost" id="back-res">← Вернуться к результату</button>
      </div>
    </div>`);
  n.querySelector("#form").addEventListener("click", () => open_(formLink(r)));
  n.querySelector("#back-res").addEventListener("click", () => result(r));
  render(n);
}

/* ——— отправка результата ———
   Два адресата, разные задачи:
   таблица получает всё сырьё для калибровки, бот — ранг и процент для сегментов. */
function send(r) {
  const tg = window.Telegram && window.Telegram.WebApp;
  const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};

  const payload = {
    rank: r.key,
    percent: r.pct,
    scales: r.scales,
    forks: forks,
    answers: answers.slice(),
    userId: user.id || "",
    userName: [user.first_name, user.last_name].filter(Boolean).join(" ")
  };
  window.__result = payload;

  if (CONFIG.sheetUrl) {
    // text/plain — чтобы браузер не слал предварительный запрос, который Apps Script не примет
    fetch(CONFIG.sheetUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).catch(() => {});
  }

  if (tg) {
    try { tg.sendData(JSON.stringify({ rank: r.key, percent: r.pct })); } catch (e) {}
  }
}

if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
intro();
</script>
