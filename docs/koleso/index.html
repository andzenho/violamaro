<meta name="twitter:card" content="summary">
<script>
/* Страховка. Если основной скрипт не разберётся или упадёт на старом браузере,
   человек увидит текст и объяснение, а не белый экран — и мы узнаем об этом.
   Здесь намеренно только ES5: этот блок обязан работать даже там, где не работает остальное.

   Стоит ВЫШЕ подключения Телеграма, и это важно. Пока тег telegram-web-app.js
   был первым и обычным, он держал разбор страницы: провайдер, который на запрос
   не отвечает отказом, а молчит, оставлял человека перед белым экраном сколько
   угодно долго — эта страховка до себя не доходила, и таймер ниже не запускался. */
(function () {
  var shown = false;
  function fallback(msg) {
    if (shown) return;
    shown = true;
    /* Причиной падения могло быть само сохранённое прохождение: формат менялся,
       а запись живёт в памяти браузера до суток. Пока её не убирали, человек
       получал этот экран при каждом открытии — сутки подряд, и «открыть заново»
       ему не помогало. Убираем сразу: перезагрузка после этого лечит. */
    try { localStorage.removeItem("viola-kl-state"); } catch (e) {}
    var box = document.getElementById("screen") || document.body;
    if (!box) return;
    box.innerHTML =
      '<div style="max-width:32rem;margin:1.5rem auto;padding:1.4rem;font:16px/1.55 system-ui,-apple-system,sans-serif;' +
      'color:#241D28;background:#fff;border:1px solid #E0D6DD;border-radius:4px">' +
      '<p style="margin:0 0 .9rem;font-size:1.2rem">Тест не открылся с первого раза</p>' +
      '<p style="margin:0 0 .9rem;color:#5C5162">Так бывает: оборвалась связь или страница не догрузилась. ' +
      'Нажмите «Открыть заново» — обычно этого хватает.</p>' +
      '<p style="margin:0 0 .9rem"><button onclick="location.reload()" ' +
      'style="font:inherit;padding:.7rem 1.1rem;color:#fff;background:#A2703C;border:0;border-radius:4px">' +
      'Открыть заново</button></p>' +
      '<p style="margin:0 0 .9rem;color:#5C5162">Не помогло — откройте ту же ссылку в обычном браузере: ' +
      '<a href="https://andzenho.github.io/violamaro/koleso/" style="color:#A2703C">andzenho.github.io/violamaro/koleso</a></p>' +
      '<p style="margin:0;font-size:.8rem;color:#8B7F92">Если и там не открылось, пришлите нам эту строку: ' +
      String(msg).replace(/</g, "&lt;").slice(0, 200) + '</p></div>';
  }
  window.__fallback = fallback;
  window.addEventListener("error", function (e) {
    fallback(e && e.message ? e.message : "неизвестная ошибка");
  });
  /* Скрипт у нас встроенный, ему нечего ждать. Пусто через семь секунд — значит не доехал. */
  setTimeout(function () {
    var s = document.getElementById("screen");
    if (s && !s.firstChild) fallback("пустой экран");
  }, 7000);

  /* ——— когда стартовать ———
     Телеграм грузится фоном и держать страницу больше не может. Тест ждёт его
     не дольше TG_WAIT: доехал раньше — стартуем сразу, не доехал — стартуем без
     него. Обращения к Телеграму в основном скрипте и так идут через
     window.Telegram && window.Telegram.WebApp, поэтому без SDK тест просто
     работает как в обычном браузере: не будет разворота во весь экран
     и телеграм-id в таблице. Это несравнимо лучше белого экрана. */
  var TG_WAIT = 3000;
  var tgSettled = false, appStart = null, launched = false;

  function launch() {
    if (launched || !tgSettled || !appStart) return;
    launched = true;
    appStart();
  }

  /* Телеграм опоздал к запуску — подхватываем его на ходу: развернуть окно
     и выключить свайпы можно и после того, как человек увидел первый экран. */
  function lateInit() {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;
    try {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    } catch (e) {}
  }

  window.__tgSettled = function () {
    if (tgSettled) return;
    tgSettled = true;
    if (launched) lateInit(); else launch();
  };
  window.__appStart = function (fn) { appStart = fn; launch(); };
  setTimeout(window.__tgSettled, TG_WAIT);
})();
</script>

        onload="window.__tgSettled && window.__tgSettled()"
        onerror="window.__tgSettled && window.__tgSettled()"></script>

  /* Палитра снята с сайта: тёплый крем, бронза, тёмно-коричневая кнопка-таблетка. */
  :root {
    --ground: #F7F2EA;
    --surface: #FFFFFF;
    --surface-2: #F6EFE5;
    --ink: #2E2521;
    --ink-soft: #5C5149;
    --ink-mute: #8A7F74;
    --line: #E4DACD;
    --line-strong: #D6C7B2;
    --accent: #8A5A2B;
    --accent-soft: #F0DCBB;
    --warn: #A33B26;
    --deep: #4A392F;
    --shadow: 0 1px 2px rgba(60, 48, 40, .06), 0 18px 40px -20px rgba(60, 48, 40, .36);
    --btn-bg: linear-gradient(160deg, #4A392F 0%, #2B211C 100%);
    --btn-ink: #F6F0E8;
    --btn-shadow: 0 10px 26px -12px rgba(43, 33, 28, .65), inset 0 1px 0 rgba(255, 255, 255, .12);
    /* Три уровня карты. Без них человек видит полосы, но не понимает,
       где норма: полоса на 47% — это хорошо или плохо? Цвет отвечает сразу. */
    --band-low: #A33B26;
    --band-mid: #C29A6C;
    --band-hi:  #4A392F;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #241C18;
      --surface: #2B211C;
      --surface-2: #352822;
      --ink: #F6F0E8;
      --ink-soft: #D8C9BA;
      --ink-mute: #A29385;
      --line: #3E312A;
      --line-strong: #55443A;
      --accent: #C9A87F;
      --accent-soft: #3A2C22;
      --warn: #E08A72;
      --deep: #F0DCBB;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 18px 40px -20px rgba(0, 0, 0, .6);
      --btn-bg: linear-gradient(160deg, #D8B991 0%, #A3835F 100%);
      --btn-ink: #241C18;
      --btn-shadow: 0 10px 26px -12px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .18);
      --band-low: #E08A72;
      --band-mid: #8A7358;
      --band-hi:  #D8B991;
    }
  }

  :root[data-theme="dark"] {
      --ground: #241C18;
    --surface: #2B211C;
    --surface-2: #352822;
    --ink: #F6F0E8;
    --ink-soft: #D8C9BA;
    --ink-mute: #A29385;
    --line: #3E312A;
    --line-strong: #55443A;
    --accent: #C9A87F;
    --accent-soft: #3A2C22;
    --warn: #E08A72;
    --deep: #F0DCBB;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 18px 40px -20px rgba(0, 0, 0, .6);
    --btn-bg: linear-gradient(160deg, #D8B991 0%, #A3835F 100%);
    --btn-ink: #241C18;
    --btn-shadow: 0 10px 26px -12px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .18);
    --band-low: #E08A72;
    --band-mid: #8A7358;
    --band-hi:  #D8B991;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Golos Text', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 34rem;
    margin: 0 auto;
    padding: 1.25rem 1.15rem calc(3rem + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    min-height: 100vh;
  }

  /* — шкала приёмника — */
  .top { display: flex; flex-direction: column; gap: .75rem; }

  .brand {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-mute);
  }

  .dial { display: flex; gap: 3px; height: 22px; align-items: flex-end; }

  .tick {
    flex: 1;

<script>
"use strict";

/* ——— куда уходит прохождение ———
   sheetUrl — адрес приёмника из skripty/test-empat-sheets.gs, тот же, что у теста
   на эмпатию: приёмник один, листы в таблице разные.

   принимается оферта и там же деньги, поэтому в лид-форме оферту не просим.

/* ——— подсчёт ———
   По каждой сфере две величины по десятибалльной шкале: сколько отдаю
   и сколько остаётся. Ответы четырёхступенчатые, поэтому 0, 3, 7, 10.
   Зазор между ними и есть цена привычки быть удобным в этой сфере. */
const STEP = [0, 3, 7, 10];

function score() {
  const by = {};
  SPHERES.forEach(x => by[x.k] = { k: x.k, t: x.t, o: [], i: [] });

  Q.forEach((q, i) => {
    const v = typeof answers[i] === "number" ? answers[i] : 0;
    by[q.sf][q.g === "out" ? "o" : "i"].push(STEP[v]);
  });

  /* Каждая ось это среднее из двух ответов: один неверно прочитанный вопрос
     не должен перекашивать целый луч колеса. */
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0;
  const wheel = SPHERES.map(x => {
    const c = by[x.k];
    const out = avg(c.o), inn = avg(c.i);
    return { k: c.k, t: c.t, out: out, inn: inn, gap: out - inn };
  });

  const out = Math.round(wheel.reduce((a, c) => a + c.out, 0) / wheel.length);
  const inn = Math.round(wheel.reduce((a, c) => a + c.inn, 0) / wheel.length);

  /* Две сферы с самым большим зазором. При равенстве вперёд идёт та,
     где меньше остаётся: там человеку и больнее. */
  const worst = wheel.slice().sort(function (a, b) {
    return (b.gap - a.gap) || (a.inn - b.inn);
  }).slice(0, 2);

  return { wheel: wheel, out: out, inn: inn, gap: out - inn, worst: worst };
}

/* ——— колесо ———
   Обычный SVG, без библиотек: шесть осей, два замкнутых контура.
   Внутренний контур появляется анимацией из полного размера в реальный —
   человек своими глазами видит, как сжимается то, что остаётся ему.
   Анимация на requestAnimationFrame, потому что она должна работать
   и на старых вебвью, где нет ни современного CSS, ни SMIL. */
const R = 84, CX = 160, CY = 112;

/* Пол для отрисовки внутреннего контура. При нулевых ответах многоугольник
   схлопывается в точку и линия просто исчезает, а исчезнуть она не должна:
   именно её сжатие и есть содержание экрана. Числа под колесом при этом
   настоящие, пол влияет только на картинку. */
const FLOOR = 0.5;

function poly(vals, floor) {
  return vals.map(function (v, i) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    const r = R * (Math.max(v, floor || 0) / 10);
    return (CX + r * Math.cos(a)).toFixed(1) + "," + (CY + r * Math.sin(a)).toFixed(1);
  }).join(" ");
}

function wheelSvg(w) {
  const axes = w.map(function (c, i) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    const x = CX + R * Math.cos(a), y = CY + R * Math.sin(a);
    const lx = CX + (R + 18) * Math.cos(a), ly = CY + (R + 18) * Math.sin(a);
    const anchor = Math.abs(Math.cos(a)) < 0.1 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
    return '<line x1="' + CX + '" y1="' + CY + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" class="ax"/>' +
           '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="' + anchor + '" class="axt">' + c.t + '</text>';
  }).join("");

  const rings = [10, 6.7, 3.3].map(function (v) {
    return '<polygon points="' + poly([v,v,v,v,v,v]) + '" class="ring"/>';
  }).join("");

  return '<svg viewBox="0 0 320 228" class="wheel" role="img" aria-label="Колесо: сколько вы отдаёте и сколько остаётся вам">' +
    rings + axes +
    '<polygon points="' + poly(w.map(function (c) { return c.out; })) + '" class="out"/>' +
    '<polygon id="inn" points="' + poly(w.map(function (c) { return c.out; }), FLOOR) + '" class="inn"/>' +
    '</svg>';
}

/* Сдуваем внутренний контур от внешнего к настоящему. Полторы секунды:
   быстрее не читается как движение, медленнее человек теряет интерес. */
function animateWheel(node, w) {
  const el = node.querySelector("#inn");
  if (!el) return;
  const from = w.map(function (c) { return c.out; });
  const to = w.map(function (c) { return c.inn; });
  let t0 = 0;
  function step(ts) {
    if (!t0) t0 = ts;
    let k = Math.min(1, (ts - t0) / 1500);
    k = 1 - Math.pow(1 - k, 3);
    el.setAttribute("points", poly(from.map(function (v, i) { return v + (to[i] - v) * k; }), FLOOR));
    if (k < 1) requestAnimationFrame(step);
  }
  if (window.requestAnimationFrame) requestAnimationFrame(step);
  else el.setAttribute("points", poly(to, FLOOR));   // без анимации, но результат верный
}

/* ——— экраны ——— */
function el(html) {
  const d = document.createElement("div");
  d.className = "fade";
  d.innerHTML = html;
  return d;
}

/* Имя из Телеграма подставляется в разметку. Кавычка в имени рвала атрибут
   value и оставляла поле пустым — а такие имена в Телеграме встречаются. */
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]);
}

/* Без replaceChildren: он появился только в Chrome 86 (конец 2020),
   а на неподновлённых Android его нет — и падал весь скрипт, экран оставался белым. */
function render(node) {
  while (screen.firstChild) screen.removeChild(screen.firstChild);
  linksThroughTelegram_(node);
  screen.appendChild(node);
  paintDial();
  toTop();
}

/* Правовые страницы открываем средствами Телеграма: обычный target=_blank
   внутри мини-аппа на части клиентов просто не срабатывает. Раньше это стояло
   только на экране анкеты — а первая такая ссылка попадается человеку раньше,
   на первом экране, под кнопкой «Начать».
   Ссылки на t.me не трогаем: их уводит openTelegramLink, и у них свои
   обработчики — перехватить здесь значило бы открыть канал дважды. */
function linksThroughTelegram_(node) {
  node.querySelectorAll("a").forEach(a => a.addEventListener("click", (e) => {
    const href = a.getAttribute("href");
    if (!href || href.indexOf("http") !== 0) return;
    if (href.indexOf("https://t.me/") === 0) return;
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.openLink) { e.preventDefault(); tg.openLink(href); }
  }));
}

/* Каждый новый экран показываем с начала — иначе человек попадает
   на середину длинного текста и не понимает, что сменилось. */
function toTop() {
  try {
    window.scrollTo(0, 0);
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  } catch (e) {}
}

function intro() {
  stage = "intro";
  const n = el(`
    <div class="card">
      <h1>Колесо эмпата</h1>
      <div class="body-copy intro-voice">
        <p>Вы отдаёте много. А вот сколько при этом остаётся вам, это вопрос.</p>
        <p>Тут двадцать четыре вопроса про шесть сфер жизни. Партнёр, семья, работа, деньги, тело, своё дело.</p>
        <p>Отвечайте первым, что откликнулось. Начнёте примерять каждое слово, получится про кого-то другого.</p>
        <p>В конце вы увидите своё колесо. Сколько вы отдаёте людям и сколько при этом остаётся вам. И увидите, где у вас совсем плохо.</p>
        <p>Правильных ответов тут нет, оценивать вас никто не будет. Три минуты. Поехали.</p>
      </div>
      <p class="quiet">Это не диагностика и не диагноз. Это способ посмотреть на себя со стороны.</p>
      <button class="go" id="start">Начать</button>
      <p class="quiet">Нажимая «Начать», вы соглашаетесь с <a href="${CONFIG.docs.privacy}" target="_blank" rel="noopener">Политикой обработки персональных данных</a>.</p>
    </div>`);
  n.querySelector("#start").addEventListener("click", () => { idx = 0; startedAt = Date.now(); stage = "q"; saveState(); question(); });
  linksThroughTelegram_(n);
  render(n);
}

function question() {
  stage = "q";
  const q = Q[idx];
  const n = el(`
    <div class="card">
      ${q.note ? `<p class="voice">${q.note}</p>` : ""}
      <div class="step">Утверждение ${idx + 1}</div>
      <h2${q.t.length > 88 ? ' class="long"' : ""}>${q.t}</h2>
      <div class="answers">
        ${SCALE.map((s, i) => `<button class="ans" data-v="${3 - i}">${s}</button>`).join("")}
      </div>
      ${idx > 0 ? `<button class="ghost" id="back">← Назад</button>` : ""}
    </div>`);

  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    answers[idx] = Number(b.dataset.v);
    idx++;
    if (idx < Q.length) { saveState(); question(); } else { idx = 0; saveState(); fork(); }
  }));
  const back = n.querySelector("#back");
  if (back) back.addEventListener("click", () => { idx--; answers.length = idx; saveState(); question(); });
  render(n);
}

function fork() {
  stage = "fork";
  const f = FORKS[idx];
  const n = el(`
    <div class="card">
      <div class="step">Ещё ${FORKS.length - idx} ${FORKS.length - idx === 1 ? "вопрос" : "вопроса"}</div>
      <h2>${f.q}</h2>
      <div class="answers">
        ${f.a.map((o, i) => `<button class="ans" data-i="${i}">${o[0]}</button>`).join("")}
      </div>
    </div>`);
  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    const pick = f.a[Number(b.dataset.i)]; forks[f.k] = pick[1]; forks[f.k + "_text"] = pick[0];
    idx++;
    saveState();
    if (idx < FORKS.length) fork(); else result();
  }));
  render(n);
}

function result(prev) {
  stage = "result";
  const r = prev || score();
  lastResult = r;
  /* Подробно разбираем только те сферы, где действительно тяжело.
     Иначе на ровном колесе разбор спорил бы с чтением выше. */
  const deep = r.worst.filter(c => readLevel(c) !== "good");

  const n = el(`
    <div class="card">
      <div class="verdict">
        <div class="cap">ваше колесо</div>
        <h1>Сколько остаётся вам</h1>
      </div>
      <div class="wheel-wrap">
        ${wheelSvg(r.wheel)}
        <div class="legend">
          <span class="lg lg-out">отдаёте</span>
          <span class="lg lg-inn">остаётся вам</span>
        </div>
      </div>
      <p class="score">Вы отдаёте на <b>${r.out}</b> из 10. Вам остаётся <b>${r.inn}</b> из 10.</p>
      <div class="unpack">
        <div class="unpack-h">Всё колесо целиком</div>
        <div class="read">
          ${r.wheel.map(c => `<p><b>${c.t}.</b> ${READ[c.k][readLevel(c)]}</p>`).join("")}
        </div>
      </div>
      ${deep.length ? `
      <div class="unpack">
        <div class="unpack-h">${deep.length > 1 ? "Разберём два самых тяжёлых места" : "Разберём самое тяжёлое место"}</div>
        ${deep.map(c => {
          const u = UNPACK[c.k] || { lines: [], cost: "" };
          return `
          <div class="un-block">
            <div class="un-name">${c.t}</div>
            <ul>${u.lines.map(x => `<li>${x}</li>`).join("")}</ul>
            ${u.cost ? `<p class="un-cost">${u.cost}</p>` : ""}
          </div>`;
        }).join("")}
      </div>` : ""}
      <p class="bridge">${verdict(r, deep.length > 0)} Доброта и привычка быть удобным разные вещи. Доброту оставляем, разбирать будем привычку.<span class="anchor">${ANCHOR}</span><span class="anchor-2">${ANCHOR_2}</span></p>
      <div class="foot">
        <button class="go big" id="offer">Что за «Неудобная»&nbsp;<span aria-hidden="true">→</span></button>
        <button class="ghost" id="share">Поделиться колесом</button>
        <button class="ghost" id="again">Пройти заново</button>
      </div>
      <p class="disclaim">Это не диагностика и не диагноз. Это способ посмотреть на себя со стороны.</p>
    </div>`);

  n.querySelector("#offer").addEventListener("click", () => offer(r));
  n.querySelector("#share").addEventListener("click", () => share(r));
  n.querySelector("#again").addEventListener("click", () => {
    answers.length = 0; clearState(); flush(); intro();
  });

  if (!prev) send(r);
  saveState();
  render(n);
  animateWheel(n, r.wheel);
}

/* Картинку из мини-аппа наружу отдать нельзя: Телеграм не даёт приложению
   передать файл. Поэтому делимся ссылкой и своими цифрами, а получатель
   проходит сам и видит своё колесо. Для воронки это и лучше: расходится
   ссылка, а не чей-то скриншот. */
function share(r) {
  const text = "Моё колесо эмпата. Отдаю на " + r.out + " из 10, остаётся " + r.inn + ". А у вас?";
  const url = "https://t.me/share/url?url=" + encodeURIComponent(CONFIG.testUrl) +
              "&text=" + encodeURIComponent(text);
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.openTelegramLink) { try { tg.openTelegramLink(url); return; } catch (e) {} }
  window.open(url, "_blank", "noopener");
}

/* ——— экран программы и переход в анкету ——— */
function open_(url) {
  if (!url) return;
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank", "noopener");
}

function offer(r) {
  const n = el(`
    <div class="card">
      <div class="title-block">
        <div class="step"><span class="tag">${OFFER.tag}</span></div>
        <div class="step">${OFFER.eyebrow}</div>
        <h2 class="offer-title">${OFFER.title}</h2>
      </div>
      <p class="lede">${OFFER.lead}</p>
      <div class="body-copy">
        <p>Колесо вы только что видели. Отдаёте на ${r.out} из 10, остаётся вам ${r.inn}. Дальше про то, как это исправить.</p>
        ${OFFER.body.map(p => `<p>${p}</p>`).join("")}
      </div>
      <div class="inside">
        <div class="inside-h">${OFFER.insideHead}</div>
        <ul>${OFFER.inside.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>
      <div class="gets">
        <div class="gets-h">${OFFER.getsHead}</div>
        <ul>${OFFER.gets.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>
      <div class="gets bonus">
        <div class="gets-h">${OFFER.bonusHead}</div>
        <ul>${OFFER.bonus.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>
      <div class="foot">
        <div class="before-cta">${OFFER.beforeCta.map(t => `<p>${t}</p>`).join("")}</div>
        <!-- Стрелка привязана неразрывным пробелом: на узком экране она уезжала одна на строку. -->
        <button class="go big" id="pay">${OFFER.cta} за ${CONFIG.price}&nbsp;<span aria-hidden="true">→</span></button>
        <p class="cta-note">${CONFIG.priceUntil
          ? `Сейчас <span class="hl">${CONFIG.price}</span>. С ${CONFIG.priceUntil} ${CONFIG.priceFull}.`
          : `Место стоит <span class="hl">${CONFIG.price}</span>.`}</p>
        <p class="cta-legal">Нажимая кнопку, вы соглашаетесь с <a href="${CONFIG.docs.privacy}" target="_blank" rel="noopener">Политикой обработки персональных данных</a>.</p>
        <button class="ghost" id="back-res">← Вернуться к результату</button>
      </div>
    </div>`);

  n.querySelector("#pay").addEventListener("click", () => lead(r));
  n.querySelector("#back-res").addEventListener("click", () => result(r));
  linksThroughTelegram_(n);
  render(n);
}

/* ——— форма перед оплатой ———
   Нужна не ради контакта: оплата его и так соберёт. Нужна затем, чтобы команда
   знала, кого ждать, и заметила человека, у которого оплата прошла, а доступ нет.
   Поэтому здесь же и снимаются тревоги «а что после оплаты» и «а если не придёт». */
function lead(r) {
  const tg = window.Telegram && window.Telegram.WebApp;
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  const known = esc([u.first_name, u.last_name].filter(Boolean).join(" "));
  const tgName = esc(u.username ? "@" + u.username : "");

  const n = el(`
    <div class="card">
      <div class="step">Событие «Неудобная»</div>
      <h2>Занимаем ваше место</h2>
      ${known && tgName
        ? `<p class="lede">Записываем как <b>${known}</b>, ${tgName}. Если что-то не так, поправьте.</p>`
        : `<p class="lede">Оставьте, как к вам обращаться и куда писать.</p>`}
      <div class="fields">
        <label>Как вас зовут
          <input id="f-name" type="text" value="${known}" placeholder="Имя" autocomplete="name">
        </label>
        <label>Телеграм
          <input id="f-tg" type="text" value="${tgName}" placeholder="@имя" autocomplete="off">
        </label>
      </div>
      <p class="promise">Доступ приходит сразу после оплаты. Если он почему-то не пришёл, отдел заботы напишет вам сам, но вы всегда можете написать первыми, и вам ответят. Мы проверяем каждую оплату руками и не закрываем вопрос, пока вы не зашли и не разобрались, как всё устроено.</p>
      <p class="quiet">Отдел заботы: <a href="${CONFIG.careChat}" target="_blank" rel="noopener">${CONFIG.careChat.replace("https://t.me/", "@")}</a></p>
      <div class="consents">
        <label class="cb" id="cb-pd-l">
          <input type="checkbox" id="cb-pd">
          <span>Я даю <a href="${CONFIG.docs.consent}" target="_blank" rel="noopener">согласие</a> на обработку моих персональных данных и ознакомлен(а) с <a href="${CONFIG.docs.privacy}" target="_blank" rel="noopener">Политикой обработки персональных данных</a>.</span>
        </label>
        <label class="cb">
          <input type="checkbox" id="cb-ads">
          <span>Я хочу получать письма и сообщения о программах и эфирах. Отписаться можно в один клик. <a href="${CONFIG.docs.ads}" target="_blank" rel="noopener">Условия рассылки</a></span>
        </label>
      </div>
      <div class="foot">
        <button class="go big" id="send">Перейти к оплате, ${CONFIG.price}&nbsp;<span aria-hidden="true">→</span></button>
        <p class="cta-note" id="hint">Оплата откроется в отдельном окне, там же условия участия.</p>
        <button class="ghost" id="back-offer">← Назад</button>
      </div>
    </div>`);

  const nameEl = n.querySelector("#f-name");
  const tgEl = n.querySelector("#f-tg");
  const btn = n.querySelector("#send");
  const hint = n.querySelector("#hint");
  const pd = n.querySelector("#cb-pd");
  const pdLabel = n.querySelector("#cb-pd-l");
  const ads = n.querySelector("#cb-ads");
  const hintText = hint ? hint.textContent : "";

  function clearWarn() {
    if (hint) { hint.classList.remove("err"); hint.textContent = hintText; }
    nameEl.classList.remove("err");
    tgEl.classList.remove("err");
    if (pdLabel) pdLabel.classList.remove("err");
  }
  function warn(msg) { if (hint) { hint.textContent = msg; hint.classList.add("err"); } }

  [nameEl, tgEl].forEach(f => f.addEventListener("input", () => { if (f.value.trim()) f.classList.remove("err"); }));
  if (pd) pd.addEventListener("change", () => { if (pd.checked) clearWarn(); });

  btn.addEventListener("click", () => {
    const name = (nameEl.value || "").trim();
    const contact = (tgEl.value || "").trim();
    if (!name || !contact) {
      if (!name) nameEl.classList.add("err");
      if (!contact) tgEl.classList.add("err");
      warn("Заполните оба поля, иначе мы не найдём вас после оплаты.");
      (name ? tgEl : nameEl).focus();
      return;
    }
    if (pd && !pd.checked) {
      pdLabel.classList.add("err");
      if (pdLabel.scrollIntoView) pdLabel.scrollIntoView({ behavior: "smooth", block: "center" });
      warn("Отметьте согласие на обработку персональных данных.");
      return;
    }
    clearWarn();
    btn.disabled = true;
    btn.textContent = "Открываю оплату…";
    sendGo(r, name, contact, { pd: !!(pd && pd.checked), ads: !!(ads && ads.checked) });
    openPay();
  });
  n.querySelector("#back-offer").addEventListener("click", () => offer(r));
  linksThroughTelegram_(n);
  render(n);
}

/* Уводим на оплату. Пока страницы оплаты нет — в чат с командой, чтобы кнопка
   не вела в никуда. Обе ссылки телеграмовские или обычные, различаем по адресу. */
function openPay() {
  const url = CONFIG.payUrl || CONFIG.teamChat;
  if (!url) return;
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    if (url.indexOf("t.me/") !== -1 && tg.openTelegramLink) {
      try { tg.openTelegramLink(url); return; } catch (e) {}
    }
    if (tg.openLink) { try { tg.openLink(url); return; } catch (e) {} }
  }
  window.open(url, "_blank", "noopener");
}

/* Отметка «пошёл платить». Формы здесь нет, контакт оставляет сама оплата, —
   но без этой записи мы не знаем, кто дошёл до кнопки и не дошёл до оплаты. */
function sendGo(r, name, contact, consent) {
  const tg = window.Telegram && window.Telegram.WebApp;
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  queue({
    test: "koleso",
    type: "lead",
    otdayu: r.out,
    ostaetsya: r.inn,
    worst: r.worst.map(c => c.k).join(","),
    forks: forks,
    userId: u.id || "",
    userLogin: u.username ? "@" + u.username : "",
    userName: [u.first_name, u.last_name].filter(Boolean).join(" "),
    name: name || "",
    contact: contact || "",
    /* Акцепт оферты собирает страница оплаты на GetCourse: там же деньги,
       там же и договор. Дважды за минуту принимать один документ незачем. */
    accept_pd: consent && consent.pd ? "да" : "",
    accept_ads: consent && consent.ads ? "да" : "",
    consent_ts: new Date().toISOString(),
    doc_version_consent: CONFIG.docVersionConsent || ""
  });
}

const BUFFER_KEY = "viola-kl-pending";

/* Данные уходят обычным GET с параметром: POST на веб-приложение Apps Script
   у анонимных запросов упирается в редирект и не доходит. Проверено. */
function send_(payload) {
  return fetch(CONFIG.sheetUrl + "?payload=" + encodeURIComponent(JSON.stringify(payload)));
}

/* Кладём в буфер и пробуем отправить. Не дошло — полежит и уйдёт
   при следующем открытии страницы. Иначе обрыв связи = потерянный лид. */
function queue(item) {
  buffer(item);
  flush();
}

function buffer(item) {
  try {
    const all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]");
    all.push(item);
    localStorage.setItem(BUFFER_KEY, JSON.stringify(all));
  } catch (e) {}
}

/* Вынимаем из буфера ровно одну запись — ту, что подтвердил приёмник. */
function unbuffer(item) {
  try {
    const s = JSON.stringify(item);
    const all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]");
    const i = all.findIndex(x => JSON.stringify(x) === s);
    if (i !== -1) {
      all.splice(i, 1);
      localStorage.setItem(BUFFER_KEY, JSON.stringify(all));
    }
  } catch (e) {}
}

const inFlight = new Set();

/* Буфер чистим ТОЛЬКО после подтверждения от приёмника.
   Раньше буфер очищался до отправки — и если Телеграм выгружал вкладку,
   пока запрос в пути (а он уходит ровно тогда, когда человека уводит в канал),
   лид пропадал молча. Дубль в таблице пережить можно, потерю контакта — нет. */
function flush() {
  if (!CONFIG.sheetUrl) return;
  let all = [];
  try { all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]"); } catch (e) { return; }
  if (!all.length) return;
  /* Обёртка не про сеть, а про сам вызов: fetch есть не в каждом вебвью,
     и на телефоне без него исключение уходило вверх — в boot(). Человек
     вместо теста получал экран отказа из-за одной недоставленной заявки. */
  try {
    all.forEach(item => {
      const key = JSON.stringify(item);
      if (inFlight.has(key)) return;     // тот же элемент уже летит — второй раз не шлём
      inFlight.add(key);
      send_(item)
        .then(res => res.text())
        .then(txt => {
          /* Приёмник отвечает {"ok":true}. Если вместо этого прилетела страница
             входа Google — значит развёртывание закрыто, и запись НЕ сохранилась.
             Оставляем её в буфере до следующего раза. */
          if (txt.indexOf('"ok"') !== -1) unbuffer(item);
        })
        .catch(() => {})
        .then(() => { inFlight.delete(key); });
    });
  } catch (e) {}
}

/* ——— отправка результата ———
   Адресат один: таблица. Она получает всё сырьё для калибровки.

   Бота отсюда НЕ трогаем. Telegram.WebApp.sendData по документации
   «отправляет служебное сообщение боту, и мини-апп закрывается» — то есть
   человек, открывший тест кнопкой клавиатуры, вылетал в чат ровно на переходе
   к результату и своего типа не видел. Ранг и процент берём из таблицы. */
function send(r) {
  const tg = window.Telegram && window.Telegram.WebApp;
  const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};

  const seconds = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;
  const same = answers.length && answers.every(x => x === answers[0]);

  const payload = {
    test: "koleso",                    // приёмник по этой метке выбирает лист
    seconds: seconds,
    fast: seconds > 0 && seconds < 25,   // 24 вопроса быстрее 25 секунд — читать человек не успевал
    monotone: same,                      // одна и та же кнопка на всё
    otdayu: r.out,
    ostaetsya: r.inn,
    zazor: r.gap,
    wheel: r.wheel.map(c => ({ k: c.k, out: c.out, inn: c.inn })),
    worst: r.worst.map(c => c.k).join(","),
    forks: forks,
    answers: answers.slice(),
    userId: user.id || "",
    /* Логин отдельным полем: по нему команда пишет человеку первой.
       Имя из Телеграма для этого не годится, тёзок много. */
    userLogin: user.username ? "@" + user.username : "",
    userName: [user.first_name, user.last_name].filter(Boolean).join(" ")
  };
  window.__result = payload;

  /* Через буфер, как и лид: обрыв связи на этом шаге раньше терял прохождение молча. */
  if (CONFIG.sheetUrl) queue(payload);
}

/* ——— сохранение прогресса ———
   Мини-апп внутри Телеграма может перезагрузиться сам: свернули и вернулись,
   система выгрузила вкладку из памяти, сработал жест закрытия. Страница при этом
   стартует заново, и без сохранения человек оказывается в начале теста.
   Держим ответы в памяти браузера и возвращаем его на то же место. */
const STATE_KEY = "viola-kl-state";
const TTL_MID = 3 * 3600e3;    // недопройденный тест живёт три часа
const TTL_DONE = 24 * 3600e3;  // готовый результат — сутки

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      t: Date.now(), stage: stage, idx: idx,
      answers: answers.slice(), forks: forks, startedAt: startedAt,
      res: lastResult
    }));
  } catch (e) {}
}

function clearState() {
  try { localStorage.removeItem(STATE_KEY); } catch (e) {}
}

/* Шкалы, без которых экран результата не построить: powers() читает их
   напрямую. Раньше запись без них роняла запуск. */
const SCALES_NEEDED = ["out", "inn", "gap"];

/* Сохранённое прохождение могло остаться от прежней версии теста: вопросы
   и способ хранения результата менялись, а запись живёт до суток. Такое
   состояние роняло boot(), и человек при каждом открытии видел экран
   «тест не открылся» — весь срок хранения. Не сошлось — молча начинаем
   заново: потерять полтора экрана ответов не так дорого, как сутки не мочь
   войти. Проходящему сейчас это ничем не грозит — его запись форме отвечает. */
function stateOk_(s) {
  const a = s.answers;
  if (!Array.isArray(a) || a.length > Q.length) return false;
  if (!a.every(v => typeof v === "number" && v >= 0 && v <= 3)) return false;
  if (s.res) {
    if (!Array.isArray(s.res.wheel) || s.res.wheel.length !== SPHERES.length) return false;
    if (!SCALES_NEEDED.every(k => typeof s.res[k] === "number")) return false;
  }
  return true;
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if (!s || !s.t) return null;
    const done = (s.answers || []).length === Q.length;
    if (Date.now() - s.t > (done ? TTL_DONE : TTL_MID)) { clearState(); return null; }
    if (!stateOk_(s)) { clearState(); return null; }
    return s;
  } catch (e) { return null; }
}

function boot() {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    /* Экран результата длинный. Пока листаешь его вниз, Телеграм может принять
       прокрутку за жест «свернуть» и утащить приложение. Bot API 7.7+ */
    if (tg.disableVerticalSwipes) { try { tg.disableVerticalSwipes(); } catch (e) {} }
  }

  flush();   // всё, что не ушло в прошлый раз, отправляем при каждом открытии

  const s = loadState();
  if (!s) { intro(); return; }

  (s.answers || []).forEach(v => answers.push(v));
  Object.keys(s.forks || {}).forEach(k => { forks[k] = s.forks[k]; });
  startedAt = s.startedAt || 0;

  if (answers.length === Q.length) {
    if (s.stage === "fork" && (s.idx || 0) < FORKS.length) { idx = s.idx || 0; fork(); return; }
    /* Аргумент обязателен: без него result() отправит прохождение в таблицу второй раз.
       Берём сохранённый вердикт, если он есть, — тогда тип не переиграется. */
    result(s.res || score());
    return;
  }
  if (s.stage === "q" && answers.length) { idx = Math.min(s.idx || 0, Q.length - 1); question(); return; }

  answers.length = 0;
  intro();
}

/* Стартуем не сразу: страховка наверху дождётся Телеграма — или того, что его
   не будет, — и позовёт сама. Прямой вызов оставлен на случай, если верхний
   блок почему-то не отработал: без запуска тест не оставляем ни при каких условиях. */
function run() {
  try {
    boot();
  } catch (e) {
    if (window.__fallback) window.__fallback(e && e.message ? e.message : e);
  }
}

if (window.__appStart) window.__appStart(run); else run();
</script>
