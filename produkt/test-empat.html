    cap: "ваш тип",
    body: [
      "Вас выбивают не люди, а сама обстановка: шум, свет, слишком много всего сразу. Устаёте вы от количества, а не от человека рядом.",
      "Такое часто описывают как СДВГ. Может быть и не так — по тесту это не решается, и заочно вам этого никто не скажет. Мешает жить — сходите очно к специалисту.",
      "Одно сказать можно точно. Чувствуете вы больше среднего. Это не диагноз и не приговор."
    ]
  }
};

const OFFER = {
  title: "Любовь и деньги",
  lead: "Так называется программа, которую Виола запускает осенью.",
  body: [
    "Она про то, как развить свою чувствительность и научиться ей управлять. Это способность, и её тренируют, как любую другую.",
    "И вот тогда дар начинает работать на вашу жизнь. На отношения, на дело, на деньги.",
    "И любовь, и деньги — это про наполненность. Про то, когда внутри полно. Когда пусто, ни то ни другое не приходит, сколько ни старайся.",
    "Изобилие — это не рог изобилия и не роскошь. Это свобода быть собой. Делать что хотите, когда хотите, с кем хотите."
  ],
  insideHead: "Чему научитесь",
  inside: [
    "Управлять громкостью: включать чувствительность, когда она нужна, и убирать, когда мешает.",
    "Читать людей осознанно и пользоваться этим — в переговорах, в отношениях, в своём деле.",
    "Направлять эмпатию в нужное русло: в работу, в своё дело, в деньги.",
    "Слышать свои желания так же ясно, как вы слышите чужие."
  ],
  format: "Практики, рабочая тетрадь, разборы и ответы Виолы.",
  perks: [
    { h: "Самая низкая цена", d: "Первый поток заходит по самой низкой цене. Назовём её в канале." },
    { h: "Закрытый канал Виолы", d: "Материалы и подкасты, которых нет нигде больше. Доступ — сразу после записи." },
    { h: "Право сказать, что включить", d: "В канале спросим, чего вам не хватает, и соберём из ваших ответов часть программы. Вы всю жизнь угадываете, что нужно другим. А тут спросят вас.", wide: true }
  ],
  cta: "Хочу в первый поток",
  note: "Два поля: имя и телеграм. Двадцать секунд — остальное мы уже знаем из вашего теста."
};

/* ——— «ваши суперспособности»: выводим из ответов, а не раздаём всем одинаково.
   Берём три самые сильные стороны — так это читается как вывод, а не как лесть. */
function powers(sc, v) {
  const list = [
    { w: sc.A,        t: "Считываете человека раньше, чем он открыл рот" },
    { w: v[1] * 3,    t: "Слышите, когда слова про одно, а человек про другое" },
    { w: v[2] * 3,    t: "Заходите в комнату и уже знаете, что тут было пять минут назад" },
    { w: sc.C,        t: "Вам рассказывают то, о чём с другими молчат" },
    { w: sc.B,        t: "Тело понимает раньше головы" },
    { w: sc.I,        t: "Растворялись в другом человеке — и собрали себя обратно" },
    { w: 9 - sc.P,    t: "Держите дистанцию и при этом не остываете к людям" },
    { w: (6 - sc.G) * 1.5, t: "Восстанавливаетесь заранее, пока ещё не накрыло" },
    { w: sc.L * 1.5,  t: "Точно знаете, от кого именно устали" }
  ];
  return list.sort((a, b) => b.w - a.w).slice(0, 3).map(x => x.t);
}

const ANCHOR = "Осенью Виола собирает под это программу — для эмпатов по всему миру. Про то, как использовать эмпатию как суперспособность.";

const FON_NOTE = "Отдельно: часть того, что вас грузит, идёт не от людей, а от общего фона — шум, свет, слишком много всего. Это не про эмпатию, и в тесте оно не решается.";

/* ——— состояние ——— */
let stage = "intro";      // intro | q | fork | result
let idx = 0;
const answers = [];        // баллы 3..0 по каждому вопросу
const forks = {};
let startedAt = 0;   // засекаем на первом вопросе — чтобы отличить честное прохождение от прокликанного

const screen = document.getElementById("screen");
const dial = document.getElementById("dial");
const counter = document.getElementById("counter");

Q.forEach(() => {
  const t = document.createElement("div");
  t.className = "tick";
  dial.appendChild(t);
});

function paintDial() {
  const ticks = dial.children;
  for (let i = 0; i < ticks.length; i++) {
    ticks[i].className = "tick" +
      (stage === "q" && i === idx ? " now" : (i < answers.length ? " done" : ""));
  }
  counter.textContent = stage === "q" ? (idx + 1) + " / " + Q.length
    : stage === "fork" ? "почти всё"
    : stage === "result" ? "результат" : "";
}

/* ——— подсчёт ——— */
function inv(v) { return 3 - v; }

function score() {
  const v = answers;
  const A = v[0] + v[1] + v[2];
  const P = inv(v[3]) + inv(v[5]) + inv(v[6]);
  const I = v[7] + v[8] + v[9];
  const B = v[10] + v[11] + v[12];
  const C = v[13] + v[14] + v[15] + v[16];
  const G = inv(v[18]) + v[19];
  const L = v[20] + v[21];
  const F = v[22] + v[23];
  const K = (v[4] === 3 ? 1 : 0) + (v[17] === 3 ? 1 : 0);

  const dar = A / 9;
  const prox = Math.max(P, I) / 9;
  const price = Math.max(B / 9, C / 12, I / 9);
  let pct = Math.round(dar * 40 + prox * 30 + price * 30);
  if (K === 2) pct -= 10;
  pct = Math.max(20, Math.min(97, pct));

  /* Порядок важен: «считывающий» проверяется последним из отказов — иначе он
     забирает и тех, у кого просто тихий приёмник, и тех, кого грузит фон. */
  let key;
  if (F >= 5 && L <= 1 && A <= 5) key = "other";
  else if (A <= 3 && C <= 4) key = "caring";
  else if (A >= 6 && P <= 3 && I <= 4 && B <= 3) key = "reader";
  else if (I >= 6 && B / 9 < .5 && C / 12 < .5 && G <= 2 && K < 2) key = "awake";
  else {
    const b = B / 9, c = C / 12, g = G / 6;
    key = (c >= b && c >= g) ? "donor" : (b >= g ? "filter" : "sleeping");
  }

  const empath = ["donor", "filter", "sleeping", "awake"].includes(key);
  return { key, pct, fon: empath && F >= 4, scales: { A, P, I, B, C, G, L, F, K } };
}

/* ——— экраны ——— */
function el(html) {
  const d = document.createElement("div");
  d.className = "fade";
  d.innerHTML = html;
  return d;
}

function render(node) {
  screen.replaceChildren(node);
  paintDial();
  toTop();
}

/* Каждый новый экран показываем с начала — иначе человек попадает
   на середину длинного текста и не понимает, что сменилось. */
function toTop() {
  try {
    window.scrollTo(0, 0);
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  } catch (e) {}
}

function intro() {
  stage = "intro";
  const n = el(`
    <div class="card">
      <h1>Есть у вас способности эмпата?</h1>
      <div class="body-copy intro-voice">
        <p>Тут двадцать четыре утверждения. Про то, как вы чувствуете других людей и что с вами при этом происходит.</p>
        <p>Отвечайте сразу, первым, что придёт в голову. Начнёте примерять каждое слово — получится про кого-то другого.</p>
        <p>И вот в конце вы увидите, есть ли у вас способности эмпата. А если есть — то как они у вас работают.</p>
        <p>Правильных ответов тут нет, оценивать вас никто не будет. Три минуты. Поехали.</p>
      </div>
      <p class="quiet">Это не диагностика и не диагноз. Это способ посмотреть на себя со стороны.</p>
      <button class="go" id="start">Начать</button>
    </div>`);
  n.querySelector("#start").addEventListener("click", () => { idx = 0; startedAt = Date.now(); question(); });
  render(n);
}

function question() {
  stage = "q";
  const q = Q[idx];
  const n = el(`
    <div class="card">
      ${q.note ? `<p class="voice">${q.note}</p>` : ""}
      <div class="step">Утверждение ${idx + 1}</div>
      <h2>${q.t}</h2>
      <div class="answers">
        ${SCALE.map((s, i) => `<button class="ans" data-v="${3 - i}">${s}</button>`).join("")}
      </div>
      ${idx > 0 ? `<button class="ghost" id="back">← Назад</button>` : ""}
    </div>`);

  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    answers[idx] = Number(b.dataset.v);
    idx++;
    if (idx < Q.length) question(); else { idx = 0; fork(); }
  }));
  const back = n.querySelector("#back");
  if (back) back.addEventListener("click", () => { idx--; answers.length = idx; question(); });
  render(n);
}

function fork() {
  stage = "fork";
  const f = FORKS[idx];
  const n = el(`
    <div class="card">
      <div class="step">Ещё ${FORKS.length - idx} ${FORKS.length - idx === 1 ? "вопрос" : "вопроса"}</div>
      <h2>${f.q}</h2>
      <div class="answers">
        ${f.a.map((o, i) => `<button class="ans" data-i="${i}">${o[0]}</button>`).join("")}
      </div>
    </div>`);
  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    const pick = f.a[Number(b.dataset.i)]; forks[f.k] = pick[1]; forks[f.k + "_text"] = pick[0];
    idx++;
    if (idx < FORKS.length) fork(); else result();
  }));
  render(n);
}

function result(prev) {
  stage = "result";
  const r = prev || score();
  const t = RESULTS[r.key];

  const n = el(`
    <div class="card">
      <div class="verdict">
        <div class="cap">${t.cap}</div>
        <h1>${t.name}</h1>
      </div>
      <div class="body-copy">${t.body.map(p => `<p>${p}</p>`).join("")}</div>
      ${["donor","filter","sleeping","awake","reader"].includes(r.key) ? `
        <div class="powers">
          <div class="powers-h">Ваши суперспособности</div>
          <ul>${powers(r.scales, answers).map(x => `<li>${x}</li>`).join("")}</ul>
        </div>` : ""}
      ${r.fon ? `<p class="addendum">${FON_NOTE}</p>` : ""}
      ${t.bridge ? `<p class="bridge">${t.bridge}${forks.zapros && ZAPROS_LINE[forks.zapros] ? " " + ZAPROS_LINE[forks.zapros] : ""}<span class="anchor">${ANCHOR}</span></p>` : ""}
      <div class="foot">
        ${t.bridge ? `<button class="go big" id="offer">Что за программа? <span aria-hidden="true">→</span></button>` : ""}
        ${!t.bridge && CONFIG.publicChannel ? `<a class="go big" id="channel" href="${CONFIG.publicChannel}" target="_blank" rel="noopener">Читать Виолу в Телеграме <span aria-hidden="true">→</span></a>
        <p class="cta-note">Каждый день — про людей, границы и чувствительность.</p>` : ""}
        <button class="ghost" id="again">Пройти заново</button>
      </div>
      <p class="disclaim">Это не диагностика и не диагноз. Это способ посмотреть на себя со стороны.</p>
    </div>`);

  const toOffer = n.querySelector("#offer");
  if (toOffer) toOffer.addEventListener("click", () => offer(r));
  const toChannel = n.querySelector("#channel");
  if (toChannel) toChannel.addEventListener("click", (e) => {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(CONFIG.publicChannel); }
  });

  n.querySelector("#again").addEventListener("click", () => { answers.length = 0; flush();   // если в прошлый раз что-то не ушло
intro(); });

  if (!prev) send(r);
  render(n);
}

/* ——— экран программы и переход в анкету ——— */
function open_(url) {
  if (!url) return;
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank", "noopener");
}

function offer(r) {
  const n = el(`
    <div class="card">
      <div class="step">Что дальше</div>
      <h2>${OFFER.title}</h2>
      <p class="lede">${OFFER.lead}</p>
      <div class="body-copy">${OFFER.body.map(p => `<p>${p}</p>`).join("")}</div>
      <div class="inside">
        <div class="inside-h">${OFFER.insideHead}</div>
        <ul>${OFFER.inside.map(i => `<li>${i}</li>`).join("")}</ul>
        <p class="format">${OFFER.format}</p>
      </div>
      <div class="perks">
        ${OFFER.perks.map(p => `<div class="perk${p.wide ? " wide" : ""}"><div class="perk-h">${p.h}</div><p>${p.d}</p></div>`).join("")}
      </div>
      <div class="foot">
        <button class="go big" id="form">${OFFER.cta} <span aria-hidden="true">→</span></button>
        <p class="cta-note">${OFFER.note}</p>
        <button class="ghost" id="back-res">← Вернуться к результату</button>
      </div>
    </div>`);
  n.querySelector("#form").addEventListener("click", () => lead(r));
  n.querySelector("#back-res").addEventListener("click", () => result(r));
  render(n);
}

/* ——— запись в первый поток: имя и телеграм берём у Телеграма, если он их знает ——— */
function lead(r) {
  const tg = window.Telegram && window.Telegram.WebApp;
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  const known = [u.first_name, u.last_name].filter(Boolean).join(" ");
  const tgName = u.username ? "@" + u.username : "";

  const n = el(`
    <div class="card">
      <div class="step">Предзапись</div>
      <h2>Записываю вас в первый поток</h2>
      ${known && tgName ? `
        <p class="lede">Записываю как <b>${known}</b>, ${tgName}. Если что-то не так — поправьте.</p>` : `
        <p class="lede">Оставьте, как к вам обращаться и куда написать приглашение.</p>`}
      <div class="fields">
        <label>Как вас зовут
          <input id="f-name" type="text" value="${known}" placeholder="Имя" autocomplete="name">
        </label>
        <label>Телеграм
          <input id="f-tg" type="text" value="${tgName}" placeholder="@имя" autocomplete="off">
        </label>
      </div>
      <p class="promise">Сразу после записи откроем закрытый канал Виолы — с материалами и подкастами, которых нет нигде больше.</p>
      <div class="foot">
        <button class="go big" id="send">Записаться <span aria-hidden="true">→</span></button>
        <p class="cta-note" id="hint">Напишем, когда откроем набор. Раньше остальных.</p>
        <button class="ghost" id="back-offer">← Назад</button>
      </div>
    </div>`);

  const nameEl = n.querySelector("#f-name");
  const tgEl = n.querySelector("#f-tg");
  const btn = n.querySelector("#send");
  const hint = n.querySelector("#hint");

  btn.addEventListener("click", () => {
    const name = (nameEl.value || "").trim();
    const contact = (tgEl.value || "").trim();
    if (!name || !contact) {
      hint.textContent = "Заполните оба поля — иначе не сможем вас позвать.";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Записываю…";
    sendLead(r, name, contact);
    done();
  });
  n.querySelector("#back-offer").addEventListener("click", () => offer(r));
  render(n);
}

function done() {
  const n = el(`
    <div class="card">
      <h2>Готово. Вы в списке первых.</h2>
      <p class="lede">Когда откроем набор, напишем вам раньше остальных и по самой низкой цене.</p>
      ${CONFIG.channelUrl ? `
        <div class="foot">
          <a class="go big" id="ch" href="${CONFIG.channelUrl}" target="_blank" rel="noopener">Забрать доступ в канал Виолы <span aria-hidden="true">→</span></a>
          <p class="cta-note">Материалы и подкасты. Там же спросим, что включить в программу.</p>
        </div>` : ""}
    </div>`);
  const ch = n.querySelector("#ch");
  if (ch) ch.addEventListener("click", (e) => {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(CONFIG.channelUrl); }
  });
  render(n);
}

const BUFFER_KEY = "viola-pending";

/* Данные уходят обычным GET с параметром: POST на веб-приложение Apps Script
   у анонимных запросов упирается в редирект и не доходит. Проверено. */
function send_(payload) {
  return fetch(CONFIG.sheetUrl + "?payload=" + encodeURIComponent(JSON.stringify(payload)));
}

/* Запись сначала кладём в буфер, потом отправляем. Не дошло — полежит
   и уйдёт при следующем открытии страницы. Иначе обрыв связи = потерянный лид. */
function sendLead(r, name, contact) {
  const tg = window.Telegram && window.Telegram.WebApp;
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  const lead = {
    type: "lead",
    name: name, contact: contact,
    rank: r.key, percent: r.pct,
    userId: u.id || "", forks: forks
  };
  buffer(lead);
  flush();
}

function buffer(item) {
  try {
    const all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]");
    all.push(item);
    localStorage.setItem(BUFFER_KEY, JSON.stringify(all));
  } catch (e) {}
}

function flush() {
  if (!CONFIG.sheetUrl) return;
  let all = [];
  try { all = JSON.parse(localStorage.getItem(BUFFER_KEY) || "[]"); } catch (e) { return; }
  if (!all.length) return;
  try { localStorage.removeItem(BUFFER_KEY); } catch (e) {}
  all.forEach(item => {
    send_(item)
      .then(res => res.text())
      .then(txt => {
        /* Приёмник отвечает {"ok":true}. Если вместо этого прилетела страница
           входа Google — значит развёртывание закрыто, и запись НЕ сохранилась.
           Возвращаем её в буфер, иначе потеряем молча. */
        if (txt.indexOf('"ok"') === -1) buffer(item);
      })
      .catch(() => buffer(item));
  });
}

/* ——— отправка результата ———
   Два адресата, разные задачи:
   таблица получает всё сырьё для калибровки, бот — ранг и процент для сегментов. */
function send(r) {
  const tg = window.Telegram && window.Telegram.WebApp;
  const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};

  const seconds = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;
  const same = answers.length && answers.every(x => x === answers[0]);

  const payload = {
    seconds: seconds,
    fast: seconds > 0 && seconds < 25,   // 24 вопроса быстрее 25 секунд — читать человек не успевал
    monotone: same,                      // одна и та же кнопка на всё
    rank: r.key,
    percent: r.pct,
    scales: r.scales,
    forks: forks,
    answers: answers.slice(),
    userId: user.id || "",
    userName: [user.first_name, user.last_name].filter(Boolean).join(" ")
  };
  window.__result = payload;

  if (CONFIG.sheetUrl) send_(payload);

  if (tg) {
    try { tg.sendData(JSON.stringify({ rank: r.key, percent: r.pct })); } catch (e) {}
  }
}

if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
intro();
</script>
